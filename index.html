<!DOCTYPE html>
<html>
  <body style="font-family: sans-serif; text-align: center; margin-top: 40px;">
    <h2>Connecting WHOOP…</h2>
    <p>Please wait while we complete authentication.</p>

    <script>
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");

      if (code) {
        const GAS_URL = "https://script.google.com/macros/s/AKfycby8xq83EU9WIm6WNIsrBBjG9oWXgzCoSDbXbKQrpFtxU2LChwrHtS4sc2-57nsKu2WgsQ/exec";
        window.location.href = GAS_URL + "?code=" + encodeURIComponent(code);
      } else {
        document.body.innerHTML = "<h2>No WHOOP code found.</h2>";
      }
    </script>
  </body>
</html>
